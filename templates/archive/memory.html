<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assistant's Memory Explorer</title>
    <!-- Add this line -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-a8d4pdp+8FGt9SjnGcxnp0gVZmEepxkITbkX+FNH86fjuW6+7+gxsnPv5wro3XkdZmtlB/MiPxjIExYc1ATjGw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Include Confetti.js -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --background-color: #fff;
            --border-color: #dee2e6;
            --accent-color: #ff6b6b;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3 {
            margin-bottom: 10px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .dashboard-item {
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            background-color: var(--background-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filters > div {
            display: flex;
            align-items: center;
        }

        select, input[type="text"], input[type="date"] {
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .memory-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .memory-lists {
            display: flex;
            flex-direction: row;
            gap: 20px;
        }

        .memory-list, .memory-details {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            background-color: var(--background-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .memory-item {
            cursor: pointer;
            padding: 10px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.3s ease;
        }

        .memory-item:hover {
            background-color: var(--secondary-color);
        }

        .chart-container {
            margin-top: 20px;
        }

        #fileUpload {
            display: none;
        }

        .file-upload-label {
            display: inline-block;
            padding: 10px 15px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .file-upload-label:hover {
            background-color: #3a7cbd;
        }

        .error {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .success {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .loading {
            display: none;
            margin-left: 10px;
        }

        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease;
            color: var(--text-color);
        }

        #theme-toggle:hover {
            transform: rotate(30deg);
        }

        body.dark-theme {
            --background-color: #1a1a1a;
            --text-color: #f0f0f0;
            --border-color: #4a4a4a;
        }

        @media (max-width: 768px) {
            .memory-lists {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <button id="theme-toggle" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>
    <h1>Assistant's Memory Explorer</h1>
    <div>
        <label for="fileUpload" class="file-upload-label">Upload JSON File</label>
        <input type="file" id="fileUpload" accept=".json">
        <span class="loading" id="loadingIndicator">Loading...</span>
    </div>
    <div id="error" class="error"></div>
    <div id="success" class="success"></div>

    <div id="dashboard" class="dashboard" style="display: none;">
        <div class="dashboard-item">
            <h3>Memory Stats</h3>
            <p id="totalMemories"></p>
            <p id="uniqueThemes"></p>
            <p id="dateRange"></p>
        </div>
        <div class="dashboard-item">
            <h3>Theme Distribution</h3>
            <canvas id="themeChart"></canvas>
        </div>
        <div class="dashboard-item">
            <h3>Mood Distribution</h3>
            <canvas id="moodChart"></canvas>
        </div>
        <div class="dashboard-item">
            <h3>Recent Activity</h3>
            <ul id="recentActivity"></ul>
        </div>
    </div>

    <div class="filters" style="display: none;">
        <div>
            <label for="themeSelect">Theme:</label>
            <select id="themeSelect"></select>
        </div>
        <div>
            <label for="searchInput">Search:</label>
            <input type="text" id="searchInput" placeholder="Search memories...">
        </div>
        <div>
            <label for="startDate">Start Date:</label>
            <input type="date" id="startDate">
        </div>
        <div>
            <label for="endDate">End Date:</label>
            <input type="date" id="endDate">
        </div>
    </div>

    <div class="memory-container" style="display: none;">
        <div class="memory-lists">
            <div class="memory-list" id="memoryList"></div>
            <div class="memory-details" id="memoryDetails"></div>
        </div>
    </div>

    <div class="chart-container" style="display: none;">
        <h3>Memory Distribution Over Time</h3>
        <canvas id="distributionChart"></canvas>
    </div>

    <script>
        let memories = {};
        let filteredMemories = {};
        let themes = [];

        const fileUpload = document.getElementById('fileUpload');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const themeSelect = document.getElementById('themeSelect');
        const searchInput = document.getElementById('searchInput');
        const startDate = document.getElementById('startDate');
        const endDate = document.getElementById('endDate');
        const memoryList = document.getElementById('memoryList');
        const memoryDetails = document.getElementById('memoryDetails');
        const dashboard = document.getElementById('dashboard');
        const filters = document.querySelector('.filters');
        const memoryContainer = document.querySelector('.memory-container');
        const chartContainer = document.querySelector('.chart-container');

        let themeChart, moodChart, distributionChart;

        fileUpload.addEventListener('change', handleFileUpload);
        themeSelect.addEventListener('change', filterMemories);
        searchInput.addEventListener('input', filterMemories);
        startDate.addEventListener('change', filterMemories);
        endDate.addEventListener('change', filterMemories);

        function showLoading(show) {
            loadingIndicator.style.display = show ? 'inline' : 'none';
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                showLoading(true);
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        processMemories(data);
                        showSuccess('File uploaded and processed successfully.');
                        // Trigger confetti effect
                        confetti({
                            particleCount: 100,
                            spread: 70,
                            origin: { y: 0.6 },
                        });
                        // Show hidden sections
                        dashboard.style.display = 'grid';
                        filters.style.display = 'flex';
                        memoryContainer.style.display = 'flex';
                        chartContainer.style.display = 'block';
                    } catch (error) {
                        showError("Error parsing JSON file. Please make sure it's valid JSON.");
                        console.error('Parsing error:', error);
                    }
                    showLoading(false);
                };
                reader.onerror = function() {
                    showError('Error reading file.');
                    showLoading(false);
                };
                reader.readAsText(file);
            }
        }

        function processMemories(data) {
            memories = data;
            // Ensure all memories have required fields
            for (const id in memories) {
                const memory = memories[id];
                memory.theme = memory.theme || 'No Theme';
                memory.message = memory.message || '';
                memory.date = memory.date || 'Unknown Date';
                memory.time = memory.time || 'Unknown Time';
                memory.mood = memory.mood || 'Unknown Mood';
            }
            themes = [...new Set(Object.values(memories).map(memory => memory.theme))];
            updateThemeSelect();
            filterMemories();
            updateDashboard();
            updateDistributionChart();
        }

        function updateThemeSelect() {
            themeSelect.innerHTML = '<option value="">All Themes</option>';
            themes.forEach(theme => {
                const option = document.createElement('option');
                option.value = theme;
                option.textContent = theme;
                themeSelect.appendChild(option);
            });
        }

        function filterMemories() {
            const selectedTheme = themeSelect.value;
            const searchTerm = searchInput.value.toLowerCase();
            const startDateValue = startDate.value;
            const endDateValue = endDate.value;

            filteredMemories = Object.fromEntries(
                Object.entries(memories).filter(([id, memory]) => {
                    const matchesTheme = selectedTheme === '' || memory.theme === selectedTheme;
                    const matchesSearch = memory.message.toLowerCase().includes(searchTerm);
                    const matchesDate = (!startDateValue || memory.date >= startDateValue) &&
                                        (!endDateValue || memory.date <= endDateValue);
                    return matchesTheme && matchesSearch && matchesDate;
                })
            );

            updateMemoryList();
            updateDashboard();
            updateDistributionChart();
        }

        function updateMemoryList() {
            memoryList.innerHTML = '';
            Object.entries(filteredMemories).forEach(([id, memory]) => {
                const div = document.createElement('div');
                div.className = 'memory-item';
                div.innerHTML = `
                    <strong>${memory.theme}</strong><br>
                    <small>${memory.date} - ${memory.time}</small><br>
                    ${memory.message.substring(0, 50)}...
                `;
                div.addEventListener('click', () => showMemoryDetails(id));
                memoryList.appendChild(div);
            });
        }

        function showMemoryDetails(id) {
            const memory = filteredMemories[id];
            memoryDetails.innerHTML = `
                <h3>${memory.theme}</h3>
                <p><small>${memory.date} - ${memory.time}</small></p>
                <p>${memory.message}</p>
                <p><strong>Mood:</strong> ${memory.mood}</p>
                <p><strong>Conversation ID:</strong> ${memory.conversation_id || 'N/A'}</p>
                <p><strong>Session ID:</strong> ${memory.session_id || 'N/A'}</p>
            `;
        }

        function updateDashboard() {
            const totalMemoriesCount = Object.keys(filteredMemories).length;
            const uniqueThemesCount = new Set(Object.values(filteredMemories).map(m => m.theme)).size;

            document.getElementById('totalMemories').textContent = `Total Memories: ${totalMemoriesCount}`;
            document.getElementById('uniqueThemes').textContent = `Unique Themes: ${uniqueThemesCount}`;
            document.getElementById('dateRange').textContent = `Date Range: ${startDate.value || 'Start'} to ${endDate.value || 'End'}`;

            updateThemeChart();
            updateMoodChart();
            updateRecentActivity();
        }

        function updateThemeChart() {
            const themeData = themes.map(theme => ({
                theme,
                count: Object.values(filteredMemories).filter(memory => memory.theme === theme).length
            }));

            const ctx = document.getElementById('themeChart').getContext('2d');
            if (themeChart) themeChart.destroy();
            themeChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: themeData.map(d => d.theme),
                    datasets: [{
                        data: themeData.map(d => d.count),
                        backgroundColor: themeData.map(() => getRandomColor())
                    }]
                }
            });
        }

        function updateMoodChart() {
            const moodData = Object.values(filteredMemories).reduce((acc, memory) => {
                acc[memory.mood] = (acc[memory.mood] || 0) + 1;
                return acc;
            }, {});

            const ctx = document.getElementById('moodChart').getContext('2d');
            if (moodChart) moodChart.destroy();
            moodChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(moodData),
                    datasets: [{
                        data: Object.values(moodData),
                        backgroundColor: '#36A2EB'
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function updateRecentActivity() {
            const recentActivity = document.getElementById('recentActivity');
            recentActivity.innerHTML = '';
            // Sort memories by date and time
            const sortedMemories = Object.values(filteredMemories).sort((a, b) => {
                const dateA = new Date(`${a.date} ${a.time}`);
                const dateB = new Date(`${b.date} ${b.time}`);
                return dateB - dateA;
            });
            sortedMemories.slice(0, 5).forEach(memory => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${memory.date}:</strong> ${memory.message.substring(0, 50)}...`;
                recentActivity.appendChild(li);
            });
        }

        function updateDistributionChart() {
            const memoryCountByDate = Object.values(filteredMemories).reduce((acc, memory) => {
                acc[memory.date] = (acc[memory.date] || 0) + 1;
                return acc;
            }, {});

            const chartData = Object.entries(memoryCountByDate)
                .sort((a, b) => new Date(a[0]) - new Date(b[0]))
                .map(([date, count]) => ({ date, count }));

            const ctx = document.getElementById('distributionChart').getContext('2d');
            if (distributionChart) distributionChart.destroy();
            distributionChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.map(d => d.date),
                    datasets: [{
                        label: 'Memory Count',
                        data: chartData.map(d => d.count),
                        borderColor: '#4BC0C0',
                        fill: false
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        },
                        x: {
                            type: 'category',
                            // Corrected x-axis type to 'category' to handle date strings
                        }
                    }
                }
            });
        }

        function getRandomColor() {
            return `hsl(${Math.floor(Math.random() * 360)}, 70%, 60%)`;
        }

        // Theme Toggle Functionality
        const themeToggle = document.getElementById('theme-toggle');

        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.body.classList.remove('dark-theme');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        // On page load, check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            setTheme(savedTheme);
        } else {
            // If no saved preference, use system preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        }

        // Listen for changes in system preference
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });

        // Theme toggle functionality
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
            // Save user preference
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
