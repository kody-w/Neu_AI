<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assistant's Memory Explorer</title>
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Time Adapter (Day.js) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-dayjs@^2"></script>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2, h3 {
            margin-bottom: 15px;
            color: #444;
        }

        /* Controls Section */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
            background-color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls > div {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .controls label {
            font-weight: bold;
            margin-right: 5px;
        }
        .controls select, .controls input[type="text"], .controls input[type="date"], .controls textarea {
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .controls button {
            padding: 7px 15px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        .controls button:hover {
            background-color: #218838;
        }
        .file-upload-label {
            display: inline-block;
            padding: 7px 15px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s ease;
            font-size: 14px;
        }
        .file-upload-label:hover {
            background-color: #0056b3;
        }
        #fileUpload {
            display: none;
        }

        /* Notifications */
        .notification {
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .notification.error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .notification.success {
            background-color: #d4edda;
            color: #155724;
        }
        .notification.loading {
            background-color: #fff3cd;
            color: #856404;
        }

        /* Dashboard Section */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .dashboard-item {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .dashboard-item h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #555;
        }
        .dashboard-item p {
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
        }

        /* Filters Section */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background-color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .filters > div {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .filters label {
            font-weight: bold;
        }
        .filters select, .filters input[type="text"], .filters input[type="date"] {
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Memory Section */
        .memory-container {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }
        .memory-list, .memory-details {
            flex: 1;
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            height: 500px;
            overflow-y: auto;
        }
        .memory-list h3, .memory-details h3 {
            margin-bottom: 15px;
            color: #555;
        }
        .memory-item {
            cursor: pointer;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s ease;
        }
        .memory-item:hover {
            background-color: #f1f1f1;
        }
        .memory-item:last-child {
            border-bottom: none;
        }
        .memory-item strong {
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }
        .memory-item small {
            color: #888;
        }
        .memory-details p {
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
        }

        /* Charts Section */
        .chart-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .chart-container h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #555;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .memory-container {
                flex-direction: column;
            }
            .controls, .filters {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <h1>Assistant's Memory Explorer</h1>
    
    <!-- Upload Section -->
    <div class="controls">
        <div>
            <label for="fileUpload" class="file-upload-label">Upload JSON File</label>
            <input type="file" id="fileUpload" accept=".json">
            <span class="notification loading" id="loadingIndicator" style="display: none;">Loading...</span>
        </div>
        <div>
            <label for="memoryInputToggle">Or:</label>
            <button id="toggleJsonInput">Paste JSON Content</button>
        </div>
        <div id="jsonInputContainer" style="display: none; flex-direction: column; width: 100%;">
            <textarea id="jsonContent" placeholder="Paste your JSON here" rows="4" style="width: 100%;"></textarea>
            <button id="parseJsonBtn" style="margin-top: 10px;">Parse JSON</button>
        </div>
    </div>

    <!-- Notifications -->
    <div id="error" class="notification error" style="display: none;"></div>
    <div id="success" class="notification success" style="display: none;"></div>

    <!-- Dashboard -->
    <div class="dashboard">
        <div class="dashboard-item">
            <h3>Memory Stats</h3>
            <p id="totalMemories">Total Memories: 0</p>
            <p id="uniqueThemes">Unique Themes: 0</p>
            <p id="dateRange">Date Range: N/A</p>
        </div>
        <div class="dashboard-item">
            <h3>Theme Distribution</h3>
            <canvas id="themeChart"></canvas>
        </div>
        <div class="dashboard-item">
            <h3>Mood Distribution</h3>
            <canvas id="moodChart"></canvas>
        </div>
        <div class="dashboard-item">
            <h3>Recent Activity</h3>
            <ul id="recentActivity" style="list-style: none;"></ul>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <div>
            <label for="themeSelect">Theme:</label>
            <select id="themeSelect">
                <option value="">All Themes</option>
            </select>
        </div>
        <div>
            <label for="searchInput">Search:</label>
            <input type="text" id="searchInput" placeholder="Search memories...">
        </div>
        <div>
            <label for="startDate">Start Date:</label>
            <input type="date" id="startDate">
        </div>
        <div>
            <label for="endDate">End Date:</label>
            <input type="date" id="endDate">
        </div>
    </div>

    <!-- Memory Section -->
    <div class="memory-container">
        <div class="memory-list">
            <h3>Memory List</h3>
            <div id="memoryList"></div>
        </div>
        <div class="memory-details">
            <h3>Memory Details</h3>
            <div id="memoryDetails">Select a memory to view details.</div>
        </div>
    </div>

    <!-- Distribution Chart -->
    <div class="chart-container">
        <h3>Memory Distribution Over Time</h3>
        <canvas id="distributionChart"></canvas>
    </div>

    <script>
        // Global Variables
        let memories = {};
        let filteredMemories = {};
        let themes = [];
        let moods = [];
        let themeChartInstance = null;
        let moodChartInstance = null;
        let distributionChartInstance = null;

        // DOM Elements
        const fileUpload = document.getElementById('fileUpload');
        const toggleJsonInput = document.getElementById('toggleJsonInput');
        const jsonInputContainer = document.getElementById('jsonInputContainer');
        const jsonContent = document.getElementById('jsonContent');
        const parseJsonBtn = document.getElementById('parseJsonBtn');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const themeSelect = document.getElementById('themeSelect');
        const searchInput = document.getElementById('searchInput');
        const startDate = document.getElementById('startDate');
        const endDate = document.getElementById('endDate');
        const memoryList = document.getElementById('memoryList');
        const memoryDetails = document.getElementById('memoryDetails');
        const totalMemories = document.getElementById('totalMemories');
        const uniqueThemes = document.getElementById('uniqueThemes');
        const dateRange = document.getElementById('dateRange');
        const recentActivity = document.getElementById('recentActivity');

        // Event Listeners
        fileUpload.addEventListener('change', handleFileUpload);
        toggleJsonInput.addEventListener('click', () => {
            jsonInputContainer.style.display = jsonInputContainer.style.display === 'none' ? 'flex' : 'none';
        });
        parseJsonBtn.addEventListener('click', handleJsonInput);
        themeSelect.addEventListener('change', filterMemories);
        searchInput.addEventListener('input', filterMemories);
        startDate.addEventListener('change', filterMemories);
        endDate.addEventListener('change', filterMemories);

        // Handle File Upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                showLoading(true);
                resetNotifications();
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!validateMemoryData(data)) {
                            throw new Error('JSON structure is invalid. Each entry must contain conversation_id, session_id, message, mood, theme, date, and time.');
                        }
                        processMemories(data);
                        showSuccess('File uploaded and processed successfully.');
                        jsonInputContainer.style.display = 'flex';
                    } catch (error) {
                        showError("Error parsing JSON file: " + error.message);
                        console.error('Parsing error:', error);
                        jsonInputContainer.style.display = 'flex';
                    }
                    showLoading(false);
                };
                reader.onerror = function() {
                    showError('Error reading file.');
                    showLoading(false);
                };
                reader.readAsText(file);
            }
        }

        // Handle JSON Input Parsing
        function handleJsonInput() {
            const jsonString = jsonContent.value.trim();
            if (jsonString) {
                showLoading(true);
                resetNotifications();
                try {
                    const data = JSON.parse(jsonString);
                    if (!validateMemoryData(data)) {
                        throw new Error('JSON structure is invalid. Each entry must contain conversation_id, session_id, message, mood, theme, date, and time.');
                    }
                    processMemories(data);
                    showSuccess('JSON content parsed and processed successfully.');
                } catch (error) {
                    showError("Error parsing JSON: " + error.message);
                    console.error('Parsing error:', error);
                }
                showLoading(false);
            } else {
                showError('Please enter JSON content.');
            }
        }

        // Validate Memory Data Structure
        function validateMemoryData(data) {
            if (typeof data !== 'object' || Array.isArray(data) || data === null) {
                return false;
            }
            return Object.values(data).every(entry => 
                typeof entry.conversation_id === 'string' &&
                typeof entry.session_id === 'string' &&
                typeof entry.message === 'string' &&
                typeof entry.mood === 'string' &&
                typeof entry.theme === 'string' &&
                typeof entry.date === 'string' &&
                typeof entry.time === 'string'
            );
        }

        // Process Memories Data
        function processMemories(data) {
            memories = data;
            // Extract unique themes and moods
            themes = [...new Set(Object.values(memories).map(memory => memory.theme))];
            moods = [...new Set(Object.values(memories).map(memory => memory.mood))];
            populateThemeSelect();
            filterMemories();
            initializeCharts();
            updateCharts();
            updateDashboard();
        }

        // Populate Theme Select Dropdown
        function populateThemeSelect() {
            themeSelect.innerHTML = '<option value="">All Themes</option>';
            themes.forEach(theme => {
                const option = document.createElement('option');
                option.value = theme;
                option.textContent = theme;
                themeSelect.appendChild(option);
            });
        }

        // Filter Memories Based on Selected Filters
        function filterMemories() {
            const selectedTheme = themeSelect.value.toLowerCase();
            const searchTerm = searchInput.value.toLowerCase();
            const start = startDate.value;
            const end = endDate.value;

            filteredMemories = Object.fromEntries(
                Object.entries(memories).filter(([id, memory]) => {
                    const matchesTheme = selectedTheme === '' || memory.theme.toLowerCase() === selectedTheme;
                    const matchesSearch = memory.message.toLowerCase().includes(searchTerm);
                    const matchesStart = !start || memory.date >= start;
                    const matchesEnd = !end || memory.date <= end;
                    return matchesTheme && matchesSearch && matchesStart && matchesEnd;
                })
            );

            updateMemoryList();
            updateDashboard();
            updateCharts();
        }

        // Update Memory List
        function updateMemoryList() {
            memoryList.innerHTML = '';
            if (Object.keys(filteredMemories).length === 0) {
                memoryList.innerHTML = '<p>No memories match the selected filters.</p>';
                return;
            }
            Object.entries(filteredMemories).forEach(([id, memory]) => {
                const memoryItem = document.createElement('div');
                memoryItem.className = 'memory-item';
                memoryItem.innerHTML = `
                    <strong>${memory.theme}</strong>
                    <small>${memory.date} - ${memory.time}</small>
                    <p>${truncateText(memory.message, 80)}</p>
                `;
                memoryItem.addEventListener('click', () => displayMemoryDetails(id));
                memoryList.appendChild(memoryItem);
            });
        }

        // Display Memory Details
        function displayMemoryDetails(id) {
            const memory = filteredMemories[id];
            if (!memory) return;
            memoryDetails.innerHTML = `
                <h3>${memory.theme}</h3>
                <p><strong>Date:</strong> ${memory.date} ${memory.time}</p>
                <p><strong>Conversation ID:</strong> ${memory.conversation_id}</p>
                <p><strong>Session ID:</strong> ${memory.session_id}</p>
                <p><strong>Mood:</strong> ${memory.mood}</p>
                <p><strong>Message:</strong> ${memory.message}</p>
            `;
        }

        // Update Dashboard Stats
        function updateDashboard() {
            const total = Object.keys(filteredMemories).length;
            totalMemories.textContent = `Total Memories: ${total}`;

            const uniqueThemesCount = new Set(Object.values(filteredMemories).map(mem => mem.theme)).size;
            uniqueThemes.textContent = `Unique Themes: ${uniqueThemesCount}`;

            const dates = Object.values(filteredMemories).map(mem => mem.date);
            if (dates.length > 0) {
                const minDate = dates.reduce((a, b) => a < b ? a : b);
                const maxDate = dates.reduce((a, b) => a > b ? a : b);
                dateRange.textContent = `Date Range: ${minDate} to ${maxDate}`;
            } else {
                dateRange.textContent = `Date Range: N/A`;
            }

            updateRecentActivity();
        }

        // Update Recent Activity List
        function updateRecentActivity() {
            recentActivity.innerHTML = '';
            const sortedMemories = Object.entries(filteredMemories).sort((a, b) => {
                if (a[1].date === b[1].date) {
                    return a[1].time.localeCompare(b[1].time);
                }
                return a[1].date.localeCompare(b[1].date);
            }).reverse();
            const recent = sortedMemories.slice(0, 5);
            if (recent.length === 0) {
                recentActivity.innerHTML = '<p>No recent activities.</p>';
                return;
            }
            recent.forEach(([id, memory]) => {
                const li = document.createElement('li');
                li.style.marginBottom = '10px';
                li.innerHTML = `
                    <strong>${memory.date} - ${memory.time}</strong><br>
                    <em>${memory.theme}</em><br>
                    ${truncateText(memory.message, 60)}...
                `;
                li.addEventListener('click', () => displayMemoryDetails(id));
                li.style.cursor = 'pointer';
                li.addEventListener('mouseover', () => {
                    li.style.backgroundColor = '#f0f0f0';
                });
                li.addEventListener('mouseout', () => {
                    li.style.backgroundColor = 'transparent';
                });
                recentActivity.appendChild(li);
            });
        }

        // Truncate Text Helper Function
        function truncateText(text, maxLength) {
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        // Initialize Charts
        function initializeCharts() {
            if (themeChartInstance) themeChartInstance.destroy();
            if (moodChartInstance) moodChartInstance.destroy();
            if (distributionChartInstance) distributionChartInstance.destroy();

            const themeCtx = document.getElementById('themeChart').getContext('2d');
            const moodCtx = document.getElementById('moodChart').getContext('2d');
            const distributionCtx = document.getElementById('distributionChart').getContext('2d');

            themeChartInstance = new Chart(themeCtx, {
                type: 'pie',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: generateColorPalette(),
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                boxWidth: 12,
                                padding: 15
                            }
                        },
                        title: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.parsed || 0;
                                    return `${label}: ${value}`;
                                }
                            }
                        }
                    }
                }
            });

            moodChartInstance = new Chart(moodCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Mood Count',
                        data: [],
                        backgroundColor: 'rgba(54, 162, 235, 0.7)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            },
                            title: {
                                display: true,
                                text: 'Count'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Mood'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.dataset.label || '';
                                    const value = context.parsed.y || 0;
                                    return `${label}: ${value}`;
                                }
                            }
                        }
                    }
                }
            });

            distributionChartInstance = new Chart(distributionCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Memories Over Time',
                        data: [],
                        fill: true,
                        backgroundColor: 'rgba(40, 167, 69, 0.2)',
                        borderColor: 'rgba(40, 167, 69, 1)',
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                tooltipFormat: 'YYYY-MM-DD'
                            },
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Number of Memories'
                            },
                            ticks: {
                                stepSize: 1
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.y || 0;
                                    return `Memories: ${value}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Update Charts Data
        function updateCharts() {
            // Theme Distribution
            const themeCounts = themes.map(theme => ({
                theme,
                count: Object.values(filteredMemories).filter(mem => mem.theme === theme).length
            }));
            themeChartInstance.data.labels = themeCounts.map(tc => tc.theme);
            themeChartInstance.data.datasets[0].data = themeCounts.map(tc => tc.count);
            themeChartInstance.data.datasets[0].backgroundColor = generateColorPalette(themeCounts.length);
            themeChartInstance.update();

            // Mood Distribution
            const moodCounts = moods.map(mood => ({
                mood,
                count: Object.values(filteredMemories).filter(mem => mem.mood === mood).length
            }));
            moodChartInstance.data.labels = moodCounts.map(mc => mc.mood);
            moodChartInstance.data.datasets[0].data = moodCounts.map(mc => mc.count);
            moodChartInstance.update();

            // Memory Distribution Over Time
            const dateMap = {};
            Object.values(filteredMemories).forEach(mem => {
                const date = mem.date;
                dateMap[date] = (dateMap[date] || 0) + 1;
            });
            const sortedDates = Object.keys(dateMap).sort();
            const memoryOverTime = sortedDates.map(date => ({
                x: date,
                y: dateMap[date]
            }));
            distributionChartInstance.data.labels = sortedDates;
            distributionChartInstance.data.datasets[0].data = memoryOverTime;
            distributionChartInstance.update();
        }

        // Generate Color Palette for Charts
        function generateColorPalette(num = 20) {
            const palette = [];
            const step = Math.floor(360 / num);
            for (let i = 0; i < num; i++) {
                const hue = i * step;
                palette.push(`hsl(${hue}, 70%, 60%)`);
            }
            return palette;
        }

        // Initialize Charts on Page Load
        window.onload = () => {
            initializeCharts();
        };

        // Update Dashboard Stats
        function updateDashboard() {
            const total = Object.keys(filteredMemories).length;
            totalMemories.textContent = `Total Memories: ${total}`;

            const uniqueThemesCount = new Set(Object.values(filteredMemories).map(mem => mem.theme)).size;
            uniqueThemes.textContent = `Unique Themes: ${uniqueThemesCount}`;

            const dates = Object.values(filteredMemories).map(mem => mem.date);
            if (dates.length > 0) {
                const minDate = dates.reduce((a, b) => a < b ? a : b);
                const maxDate = dates.reduce((a, b) => a > b ? a : b);
                dateRange.textContent = `Date Range: ${minDate} to ${maxDate}`;
            } else {
                dateRange.textContent = `Date Range: N/A`;
            }

            updateRecentActivity();
        }

        // Update Recent Activity List
        function updateRecentActivity() {
            recentActivity.innerHTML = '';
            const sortedMemories = Object.entries(filteredMemories).sort((a, b) => {
                if (a[1].date === b[1].date) {
                    return a[1].time.localeCompare(b[1].time);
                }
                return a[1].date.localeCompare(b[1].date);
            }).reverse();
            const recent = sortedMemories.slice(0, 5);
            if (recent.length === 0) {
                recentActivity.innerHTML = '<p>No recent activities.</p>';
                return;
            }
            recent.forEach(([id, memory]) => {
                const li = document.createElement('li');
                li.style.marginBottom = '10px';
                li.innerHTML = `
                    <strong>${memory.date} - ${memory.time}</strong><br>
                    <em>${memory.theme}</em><br>
                    ${truncateText(memory.message, 60)}...
                `;
                li.addEventListener('click', () => displayMemoryDetails(id));
                li.style.cursor = 'pointer';
                li.addEventListener('mouseover', () => {
                    li.style.backgroundColor = '#f0f0f0';
                });
                li.addEventListener('mouseout', () => {
                    li.style.backgroundColor = 'transparent';
                });
                recentActivity.appendChild(li);
            });
        }

        // Truncate Text Helper Function
        function truncateText(text, maxLength) {
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        // Reset Notifications
        function resetNotifications() {
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            errorDiv.textContent = '';
            successDiv.textContent = '';
        }

        // Show Error Notification
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        // Show Success Notification
        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        // Show or Hide Loading Indicator
        function showLoading(show) {
            loadingIndicator.style.display = show ? 'inline-block' : 'none';
        }
    </script>
</body>
</html>
